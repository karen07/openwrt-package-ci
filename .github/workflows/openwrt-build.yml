name: Build OpenWrt packages
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      package:
        required: false
        type: string
        default: all
      include:
        required: false
        type: string
        default: "*"
      exclude:
        required: false
        type: string
        default: "microchipsw/lan969x"
permissions:
  contents: write
jobs:
  generate-config:
    runs-on: ubuntu-latest
    outputs:
      job-config: ${{ steps.generate-config.outputs.job-config }}
      package: ${{ steps.inputs.outputs.package }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Checkout shared CI
        uses: actions/checkout@v5
        with:
          repository: karen07/openwrt-package-ci
          ref: main
          path: .openwrt-package-ci
      - name: Resolve inputs
        id: inputs
        shell: bash
        run: |
          version="${{ inputs.tag_name }}"
          package="${{ inputs.package }}"
          include="${{ inputs.include }}"
          exclude="${{ inputs.exclude }}"

          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "OpenWrt version is empty" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "INCLUDE=$include" >> "$GITHUB_ENV"
          echo "EXCLUDE=$exclude" >> "$GITHUB_ENV"
      - name: Generate matrix
        id: generate-config
        shell: bash
        run: |
          chmod +x ./.openwrt-package-ci/openwrt-matrix.py
          ./.openwrt-package-ci/openwrt-matrix.py "$VERSION" "$INCLUDE" "$EXCLUDE"
  build:
    name: "v${{ matrix.build_env.tag }} - ${{ matrix.build_env.pkgarch }} :: ${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }}"
    runs-on: ubuntu-latest
    needs: generate-config
    strategy:
      fail-fast: false
      matrix:
        build_env: ${{ fromJson(needs.generate-config.outputs.job-config) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Checkout shared CI
        uses: actions/checkout@v5
        with:
          repository: karen07/openwrt-package-ci
          ref: main
          path: .openwrt-package-ci
      - name: Install host build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            curl \
            file \
            flex \
            gawk \
            gettext \
            git \
            gzip \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd
      - name: Cache OpenWrt SDK archive
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: .openwrt-build/openwrt-sdk-*.tar.*
          key: ${{ runner.os }}-openwrt-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}
      - name: Build packages
        shell: bash
        run: |
          cp ./.openwrt-package-ci/openwrt-build.sh ./openwrt-build.sh
          chmod +x ./openwrt-build.sh
          ./openwrt-build.sh \
            build-target \
            "${{ needs.generate-config.outputs.package }}" \
            "${{ matrix.build_env.tag }}" \
            "${{ matrix.build_env.target }}" \
            "${{ matrix.build_env.subtarget }}" \
            "${{ matrix.build_env.pkgarch }}" \
            release
      - name: Upload artifacts for act
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-v${{ matrix.build_env.tag }}-${{ matrix.build_env.pkgarch }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}
          path: release/*.apk
          if-no-files-found: error
      - name: Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.apk
          tag_name: v${{ matrix.build_env.tag }}
