name: Build OpenWrt packages
on:
  workflow_call:
    inputs:
      openwrt_version:
        description: "OpenWrt version: 25.12.6, 25.12-SNAPSHOT, or SNAPSHOT (master)"
        required: false
        type: string
        default: ""
      tag_name:
        description: "Legacy alias of openwrt_version (kept for existing callers)"
        required: false
        type: string
        default: ""
      package:
        required: false
        type: string
        default: all
      include:
        required: false
        type: string
        default: "*"
      exclude:
        required: false
        type: string
        default: "microchipsw/lan969x"
permissions:
  contents: write
jobs:
  generate-config:
    runs-on: ubuntu-latest
    outputs:
      job-config: ${{ steps.generate-config.outputs.job-config }}
      package: ${{ steps.inputs.outputs.package }}
      version: ${{ steps.inputs.outputs.version }}
      is_snapshot: ${{ steps.inputs.outputs.is_snapshot }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Checkout shared CI
        uses: actions/checkout@v5
        with:
          repository: karen07/openwrt-package-ci
          ref: main
          path: .openwrt-package-ci
      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          INPUT_OPENWRT_VERSION: ${{ inputs.openwrt_version }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_INCLUDE: ${{ inputs.include }}
          INPUT_EXCLUDE: ${{ inputs.exclude }}
        run: |
          version="${INPUT_OPENWRT_VERSION:-$INPUT_TAG_NAME}"
          version="${version#v}"

          case "${version,,}" in
            master)
              echo "OpenWrt master is published as SNAPSHOT; use SNAPSHOT instead of master" >&2
              exit 1
              ;;
            snapshot)
              version=SNAPSHOT
              ;;
            *-snapshot)
              version="${version%-*}-SNAPSHOT"
              ;;
          esac

          if [[ -z "$version" || "$version" == *..* || "$version" =~ [^a-zA-Z0-9._-] ]]; then
            echo "Invalid OpenWrt version: $version" >&2
            exit 1
          fi

          is_snapshot=false
          if [[ "$version" == SNAPSHOT || "$version" == *-SNAPSHOT ]]; then
            is_snapshot=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$is_snapshot" >> "$GITHUB_OUTPUT"
          echo "package=$INPUT_PACKAGE" >> "$GITHUB_OUTPUT"

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "INCLUDE=$INPUT_INCLUDE" >> "$GITHUB_ENV"
          echo "EXCLUDE=$INPUT_EXCLUDE" >> "$GITHUB_ENV"
      - name: Generate matrix
        id: generate-config
        shell: bash
        run: |
          chmod +x ./.openwrt-package-ci/openwrt-matrix.py
          ./.openwrt-package-ci/openwrt-matrix.py "$VERSION" "$INCLUDE" "$EXCLUDE"
  build:
    name: "OpenWrt ${{ matrix.build_env.tag }} - ${{ matrix.build_env.pkgarch }} :: ${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }}"
    runs-on: ubuntu-latest
    needs: generate-config
    strategy:
      fail-fast: false
      matrix:
        build_env: ${{ fromJson(needs.generate-config.outputs.job-config) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Checkout shared CI
        uses: actions/checkout@v5
        with:
          repository: karen07/openwrt-package-ci
          ref: main
          path: .openwrt-package-ci
      - name: Install host build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            curl \
            file \
            flex \
            gawk \
            gettext \
            git \
            gzip \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd
      - name: Cache stable OpenWrt SDK archive
        if: ${{ needs.generate-config.outputs.is_snapshot != 'true' }}
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: .openwrt-build/openwrt-sdk-*.tar.*
          key: ${{ runner.os }}-openwrt-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}
      - name: Build packages
        shell: bash
        run: |
          cp ./.openwrt-package-ci/openwrt-build.sh ./openwrt-build.sh
          chmod +x ./openwrt-build.sh
          ./openwrt-build.sh \
            build-target \
            "${{ needs.generate-config.outputs.package }}" \
            "${{ matrix.build_env.tag }}" \
            "${{ matrix.build_env.target }}" \
            "${{ matrix.build_env.subtarget }}" \
            "${{ matrix.build_env.pkgarch }}" \
            artifacts
      - name: Upload snapshot artifacts (also used by act)
        if: ${{ env.ACT || needs.generate-config.outputs.is_snapshot == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ matrix.build_env.tag }}-${{ matrix.build_env.pkgarch }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}
          path: artifacts/*.apk
          if-no-files-found: error
      - name: Release stable builds
        if: ${{ !env.ACT && needs.generate-config.outputs.is_snapshot != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.apk
          tag_name: v${{ matrix.build_env.tag }}
